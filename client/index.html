<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>News Management System</title>

        <meta
            name="description"
            content="This is a news management system where you can get access to all the latest news around the world."
        />

        <meta
            name="keywords"
            content="news, management, system, latest, world"
        />

        <meta name="author" content="Anup Bhattachan" />

        <!-- Canonical URL -->
        <link rel="canonical" href="https://yourdomain.com/" />

        <!-- Open Graph for sharing in other medias -->
        <meta property="og:title" content="News Management System" />

        <meta
            property="og:description"
            content="This is a news management system where you can get access to all the latest news around the world."
        />

        <meta property="og:type" content="website" />

        <meta property="og:url" content="https://yourdomain.com/" />

        <meta
            property="og:image"
            content="https://yourdomain.com/og-image.jpg"
        />

        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="News Management System" />

        <!-- Twitter Card tags -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="News Management System" />
        <meta
            name="twitter:description"
            content="This is a news management system where you can get access to all the latest news around the world."
        />
        <meta
            name="twitter:image"
            content="https://yourdomain.com/og-image.jpg"
        />

        <!-- Additional SEO -->
        <meta name="robots" content="index, follow" />
        <meta name="googlebot" content="index, follow" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
